# Nightly refresh — ~00:00 Europe/Lisbon (GitHub Actions cron is UTC).
# Winter (WET, UTC+0): 00:00 UTC. Summer (WEST, UTC+1): use 23:00 UTC instead.
#
# GitHub disables scheduled workflows after ~60 days without repo activity.
# Any push/commit re-enables them — keep this file or main moving if nights go quiet.
#
# Required repo secrets:
#   API_URL      — https://your-api.onrender.com
#   CRON_SECRET  — same value as Render CRON_SECRET

name: Nightly refresh

on:
  schedule:
    # 00:00 Lisbon in winter (WET)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "stocks | crypto | all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - stocks
          - crypto

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refresh stocks
        if: ${{ github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'stocks' }}
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w "%{http_code}" -X POST "${API_URL}/api/refresh/stocks" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 1500)"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error::Refresh stocks failed with HTTP ${code}"
            exit 1
          fi

      - name: Refresh crypto
        if: ${{ github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'crypto' }}
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w "%{http_code}" -X POST "${API_URL}/api/refresh/crypto" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            --max-time 1500)"
          cat "$body"
          echo
          if [[ "$code" != "200" ]]; then
            echo "::error::Refresh crypto failed with HTTP ${code}"
            exit 1
          fi
