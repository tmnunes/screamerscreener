# Render Blueprint — web API + nightly cron jobs
# Cron jobs typically need a paid Render plan.
# https://render.com/docs/cronjobs

services:
  - type: web
    name: screamerscreener-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EODHD_API_KEY
        sync: false
      - key: MAX_EODHD_REQUESTS_PER_RUN
        value: "18"
      - key: FREECRYPTOAPI_API_KEY
        sync: false
      - key: MAX_FREECRYPTOAPI_REQUESTS_PER_RUN
        value: "40"
      - key: CRYPTO_TOP_N
        value: "25"
      - key: CRYPTO_HISTORY_DAYS
        value: "730"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VORTEX_LENGTH
        value: "47"
      - key: VORTEX_MULT
        value: "1.6"
      - key: VORTEX_SOURCE
        value: "hlc3"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CRON_SECRET
        sync: false

  # 00:00 UTC — change schedule if you want Lisbon local midnight
  - type: cron
    name: screamerscreener-refresh-stocks
    runtime: python
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jobs.nightly_refresh stocks
    envVars:
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: EODHD_API_KEY
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: MAX_EODHD_REQUESTS_PER_RUN
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: SUPABASE_URL
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_LENGTH
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_MULT
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_SOURCE

  - type: cron
    name: screamerscreener-refresh-crypto
    runtime: python
    schedule: "15 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.jobs.nightly_refresh crypto
    envVars:
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: FREECRYPTOAPI_API_KEY
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: MAX_FREECRYPTOAPI_REQUESTS_PER_RUN
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: CRYPTO_TOP_N
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: CRYPTO_HISTORY_DAYS
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: SUPABASE_URL
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_LENGTH
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_MULT
      - fromService:
          name: screamerscreener-api
          type: web
          envVarKey: VORTEX_SOURCE
