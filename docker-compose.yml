# Optional local orchestration for later phases.
# Phase 1 does not require Docker.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    profiles:
      - full

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    profiles:
      - full
